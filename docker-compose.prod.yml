version: '3.8'

# AgentShield Production Docker Compose
# Complete stack: Nginx, Backend, LLM Service, Ollama, Prometheus, Grafana

services:
  # Nginx API Gateway / Reverse Proxy
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: agentshield-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    environment:
      - TZ=UTC
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend Instances (3 replicas)
  backend-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentshield-backend-1
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=agentshield
      - DB_USER=${DB_USER:-agentshield}
      - DB_PASSWORD=${DB_PASSWORD:-agentshield_password}
      - DB_POOL_SIZE=10
      - LLM_SERVICE_URL=http://llm-api:8000
      - APPROVAL_MODE=auto
      - ENABLE_LLM=true
      - LOG_LEVEL=info
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/agentshield.config.yaml:/app/agentshield.config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      llm-api:
        condition: service_healthy
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentshield-backend-2
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=agentshield
      - DB_USER=${DB_USER:-agentshield}
      - DB_PASSWORD=${DB_PASSWORD:-agentshield_password}
      - DB_POOL_SIZE=10
      - LLM_SERVICE_URL=http://llm-api:8000
      - APPROVAL_MODE=auto
      - ENABLE_LLM=true
      - LOG_LEVEL=info
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/agentshield.config.yaml:/app/agentshield.config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      llm-api:
        condition: service_healthy
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-3:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentshield-backend-3
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=agentshield
      - DB_USER=${DB_USER:-agentshield}
      - DB_PASSWORD=${DB_PASSWORD:-agentshield_password}
      - DB_POOL_SIZE=10
      - LLM_SERVICE_URL=http://llm-api:8000
      - APPROVAL_MODE=auto
      - ENABLE_LLM=true
      - LOG_LEVEL=info
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/agentshield.config.yaml:/app/agentshield.config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      llm-api:
        condition: service_healthy
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama LLM Runtime
  ollama:
    image: ollama/ollama:latest
    container_name: agentshield-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
      - TZ=UTC
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # FastAPI LLM Service
  llm-api:
    build:
      context: .
      dockerfile: llm/Dockerfile
    container_name: agentshield-llm-api
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b
      - OLLAMA_TIMEOUT=60
      - LLM_TEMPERATURE=0
      - LLM_API_HOST=0.0.0.0
      - LLM_API_PORT=8000
      - LOG_LEVEL=info
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./llm/logs:/app/logs
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start-period: 15s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: agentshield-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: agentshield-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database (optional, for scaling)
  postgres:
    image: postgres:15-alpine
    container_name: agentshield-postgres
    environment:
      - POSTGRES_DB=agentshield
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama-data:
  nginx-cache:
  nginx-logs:
  prometheus-data:
  grafana-data:
  postgres-data:

networks:
  agentshield:
    driver: bridge
