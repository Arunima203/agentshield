# AgentShield API Gateway Configuration
# Nginx reverse proxy and load balancer for production deployment

# Upstream backend servers
upstream backend {
    least_conn;
    server backend1:5000 max_fails=3 fail_timeout=30s;
    server backend2:5000 max_fails=3 fail_timeout=30s;
    server backend3:5000 max_fails=3 fail_timeout=30s;
    
    keepalive 32;
}

# Upstream LLM service
upstream llm_service {
    least_conn;
    server llm1:8000 max_fails=2 fail_timeout=30s;
    server llm2:8000 max_fails=2 fail_timeout=30s;
    
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=inspect_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

# Cache configuration
proxy_cache_path /var/cache/nginx/agentshield levels=1:2 keys_zone=backend_cache:10m max_size=1g inactive=60m;

# Logging format
log_format agentshield_access '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct="$upstream_connect_time" '
    'uht="$upstream_header_time" urt="$upstream_response_time" '
    'decision=$http_x_agentshield_decision score=$http_x_agentshield_score';

log_format agentshield_error 'time=$time_iso8601 level=$severity '
    'client=$remote_addr method=$request_method '
    'request="$request" status=$status '
    'upstream=$upstream_addr response_time=$request_time';

# SSL configuration
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name agentshield.example.com;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name agentshield.example.com;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/agentshield.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentshield.example.com/privkey.pem;
    
    # Logging
    access_log /var/log/nginx/agentshield_access.log agentshield_access;
    error_log /var/log/nginx/agentshield_error.log warn;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    
    # Health checks
    location /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        access_log off;
    }
    
    # Liveness probe
    location /live {
        return 200 '{"status":"alive"}';
        add_header Content-Type application/json;
        access_log off;
    }
    
    # Readiness probe
    location /ready {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        access_log off;
    }
    
    # Metrics endpoint (restricted)
    location /metrics {
        allow 10.0.0.0/8;      # Internal networks only
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        access_log off;
    }
    
    # Inspect endpoint (main security analysis)
    location /inspect {
        limit_req zone=inspect_limit burst=20 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Error handling
        proxy_intercept_errors on;
    }
    
    # Authentication endpoints
    location /auth {
        limit_req zone=auth_limit burst=5 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Stricter timeouts for auth
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
    
    # Approval endpoints
    location /approvals {
        limit_req zone=api_limit burst=50 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Audit log endpoints (read-only)
    location /audit {
        limit_req zone=api_limit burst=30 nodelay;
        
        # Restrict to GET/HEAD only
        limit_except GET HEAD {
            deny all;
        }
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Cache audit queries
        proxy_cache backend_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
    
    # LLM API (internal only)
    location /llm-api {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://llm_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        
        # Longer timeout for LLM inference
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Configuration endpoints (restricted)
    location /config {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        # Restrict to GET only
        limit_except GET HEAD {
            deny all;
        }
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        access_log off;
    }
    
    # Status endpoint for monitoring
    location /status {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
    
    # Default location
    location / {
        limit_req zone=api_limit burst=100 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Metrics/monitoring server (internal only)
server {
    listen 9090;
    server_name _;
    
    location /metrics {
        proxy_pass http://backend;
    }
    
    location /health {
        proxy_pass http://backend;
    }
}
