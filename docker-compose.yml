# AgentShield Development Docker Compose
# Quick local setup: Backend, LLM Service

services:
  # Backend Node.js Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentshield-backend-dev
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      HOST: 0.0.0.0
      DB_PATH: /app/data/agentshield.db
      LLM_API_URL: http://llm-api:8000
      ENABLE_LLM: "true"
      APPROVAL_MODE: auto
      LOG_LEVEL: debug
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
    volumes:
      - ./backend/src:/app/src
      - ./backend/agentshield.config.yaml:/app/agentshield.config.yaml
      - backend-data:/app/data
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI LLM Service (optional)
  llm-api:
    build:
      context: ./llm
      dockerfile: Dockerfile
    container_name: agentshield-llm-dev
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
      OLLAMA_TIMEOUT: 60
      LLM_TEMPERATURE: 0
      LLM_API_HOST: 0.0.0.0
      LLM_API_PORT: 8000
      LOG_LEVEL: info
    depends_on:
      - ollama
    volumes:
      - ./llm/logs:/app/logs
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - llm

  # Ollama LLM Runtime (optional)
  ollama:
    image: ollama/ollama:latest
    container_name: agentshield-ollama-dev
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_MODELS: /root/.ollama/models
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - llm

volumes:
  ollama-data:
  backend-data:

networks:
  agentshield:
    driver: bridge
